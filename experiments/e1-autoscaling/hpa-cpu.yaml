apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ngs-worker-cpu
  namespace: ngs-bench
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ngs-worker
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30
